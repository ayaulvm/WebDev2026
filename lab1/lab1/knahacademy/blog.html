<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Project: Blog</title>

    <style>
      body {
        font-family: serif;
        background-color: rgb(245, 199, 245);
      }

      h1 {
        font-family: sans-serif;
        color: rgb(8, 0, 8);
      }

      h2 {
        color: rgb(84, 7, 84);

      }

      .date {

      .post {
        background-color: rgb(247, 242, 247);
      }

      a {
        color: rgb(12, 148, 21);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>

    <h1>Aya's blog</h1>

    <h3>Contents</h3>
    <ul>
      <li><a href="#post1">First post</a></li>
      <li><a href="#post2">Second post</a></li>
    </ul>

    <div class="post">
      <h2 id="post1">First post</h2>
      <p class="date">Posted on April 2023</p>
      <p>
        Today I visited nomads city.  
      </p>
    </div>

    <div class="post">
      <h2 id="post2">Second post</h2>
      <p class="date">Posted May 2023</p>
      <p>
        I am on the boat.
      </p>
    </div>

  </body>
</html>
